name: Build, Push and Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/github-actions-todo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/github-actions-todo:${{ github.sha }}

      - name: Trigger cloud deployment on Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl --fail --show-error --silent -X POST "$RENDER_DEPLOY_HOOK"
            echo "Render deployment triggered."
          else
            echo "RENDER_DEPLOY_HOOK is not configured; image was pushed, but cloud deployment was not triggered."
          fi
